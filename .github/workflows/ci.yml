name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-macos:
    name: Build, Static Guards, Tests & Latency Budget
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run full verification suite
        env:
          DISPLAYVOLUME_ADHOC_SIGN: "1"
        run: |
          chmod +x Scripts/build.sh Scripts/verify.sh Scripts/package_dmg.sh Scripts/build_ota.sh
          ./Scripts/verify.sh

      - name: Smoke-test same-source DMG packaging
        run: ./Scripts/package_dmg.sh
