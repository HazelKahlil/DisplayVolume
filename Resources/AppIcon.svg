<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dockShadow" x="36" y="48" width="952" height="952" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#020612" flood-opacity="0.42"/>
    </filter>
    <linearGradient id="baseBg" x1="200" y1="100" x2="824" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D333E"/>
      <stop offset="50%" stop-color="#181C24"/>
      <stop offset="100%" stop-color="#0C0F14"/>
    </linearGradient>
    <radialGradient id="topFresnel" cx="310" cy="174" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="52%" stop-color="#94A3B8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="speakerGrad" x1="302" y1="346" x2="502" y2="626" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="barFill" x1="280" y1="681" x2="614" y2="681" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="rimBevel" x1="120" y1="100" x2="904" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.56"/>
